      label: 镜像库凭证
      detail: 私有镜像库凭证信息
      delete: 删除凭证
      nameRequired: 镜像库凭证名称不能为空
      addressRequired: 镜像库凭证地址不能为空
      usernameRequired: 镜像库凭证用户名不能为空
      passwordRequired: 镜像库凭证密码不能为空
      ignoreNameConflicts: 忽略同名资源
    ingress:
      label: 负载均衡(Ingress)
      detail: 应用提供的对外访问方式
