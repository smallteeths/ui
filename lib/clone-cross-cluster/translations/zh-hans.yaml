    containerName: 容器名称
    target:
      label: 目标项目
      prompt: 选择目标项目
    formNamespace:
      label: 命名空间
      prompt: 选择命名空间...
    environment:
      newFrom: 新建并引用其他资源
      from: 引用目其他资源
