name: Setup UI Env
description: Setup node, python and call bootstrap script

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v3
      with:
        node-version: '14.x'
  
    - name: Update packages
      shell: bash
      run: |
        DEBIAN_FRONTEND=noninteractive apt update

    - name: Install Python for node-sass
      shell: bash
      run: |
        DEBIAN_FRONTEND=noninteractive apt install -y make wget g++ gcc
        DEBIAN_FRONTEND=noninteractive wget https://www.python.org/ftp/python/2.2/Python-2.2.tgz
        DEBIAN_FRONTEND=noninteractive tar xzf Python-2.2.tgz
        DEBIAN_FRONTEND=noninteractive cd Python-2.2
        DEBIAN_FRONTEND=noninteractive ./configure --enable-optimizations
        DEBIAN_FRONTEND=noninteractive make install
        DEBIAN_FRONTEND=noninteractive cd ..
        DEBIAN_FRONTEND=noninteractive rm Python-2.2.tgz
        DEBIAN_FRONTEND=noninteractive rm -r Python-2.2
        npm install --global yarn

    - name: Install packages
      shell: bash
      run:  ./scripts/bootstrap
