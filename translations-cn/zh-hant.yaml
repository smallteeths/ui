    "     node_selector:"
    "       app: ingress"
  network: |
    ""
    "  # 如果您在AWS上使用calico"
    ""
    "     network:"
    "       plugin: calico"
    "       calico_network_provider:"
    "         cloud_provider: aws"
    ""
    "  # 指定flannel的網絡接口"
    ""
    "     network:"
    "       plugin: flannel"
    "       flannel_network_provider:"
    "         iface: eth1"
    ""
    "  # 指定canal網絡插件的flannel網絡接口"
    ""
    "     network:"
    "       plugin: canal"
    "       canal_network_provider:"
    "         iface: eth1"
  services: |+
    ""
    " # 自定義服務參數"
    "     services:"
    "       kube-api:"
    "         service_cluster_ip_range: 10.43.0.0/16"
    "       kube-controller:"
    "         cluster_cidr: 10.42.0.0/16"
    "         service_cluster_ip_range: 10.43.0.0/16"
    "       kubelet:"
    "         cluster_domain: cluster.local"
    "         cluster_dns_server: 10.43.0.10"
    "         # 擴展變量 "
    "         extra_args:"
    "           # 修改節點最大Pod數量"
    "           max-pods: '250' "
    "       etcd:"
    "         # 修改空間配額為$((4*1024*1024*1024))，默認2G,最大8G"
